name: Telemetry

# Redraws assets/telemetry.svg from the real contribution calendar.
# Runs just after midnight in Brisbane, on demand, and whenever the renderer changes.
on:
  schedule:
    - cron: "17 14 * * *" # 00:17 AEST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/telemetry.mjs"
      - ".github/scripts/glyphs.json"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render console
        run: node .github/scripts/telemetry.mjs --out assets/telemetry.svg
        env:
          # Optional: a TELEMETRY_TOKEN secret (classic PAT with read:user) also counts
          # private contributions without the profile's "private contributions" setting.
          GITHUB_TOKEN: ${{ secrets.TELEMETRY_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit when it changed
        run: |
          if git diff --quiet -- assets/telemetry.svg; then
            echo "Telemetry unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg
          git commit -m "chore(telemetry): refresh contribution console"
          git push
